name: Non-model checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest tests vendor/tests -q
      - run: python tools/release_check.py
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pcc-codex-source
          path: dist/*
